[project]
name = "argos-tools"
version = "0.1.0"
description = "Catalog tooling for Argos"
requires-python = ">=3.11"
dependencies = []           # stdlib only, on purpose -- see argos/catalog.py

[project.scripts]
argos = "argos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argos*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
